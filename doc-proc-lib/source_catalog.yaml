sources:
  - id: azure_blob_storage
    name: "Azure Blob Storage"
    description: "Crawl documents from Azure Blob Storage containers"
    type: azure_blob
    module_name: azure_blob_source
    module_path: ./doc/proc/source/azure_blob_source.py
    class_name: AzureBlobSource
    version: "1.0"
    settings_schema:
      account_name:
        type: string
        title: "Storage Account Name"
        description: "Azure Storage Account name"
        required: true
        env_var: AZURE_STORAGE_ACCOUNT_NAME
      container_name:
        type: string
        title: "Container Name"
        description: "Blob container name to crawl"
        required: true
        env_var: AZURE_STORAGE_CONTAINER_NAME
      credential_type:
        type: string
        title: "Credential Type"
        description: "Authentication method to use"
        required: true
        enum: [default_azure_credential, azure_key_credential]
        default: default_azure_credential
      credential_key:
        type: string
        title: "Storage Account Key"
        description: "Storage account access key (required for azure_key_credential)"
        sensitive: true
        env_var: AZURE_STORAGE_ACCOUNT_KEY
    ui_metadata:
      icon: "cloud-storage"
      color: "#0078d4"
      description_short: "Azure Blob Storage crawler"
      description_long: "Crawls and retrieves documents from Azure Blob Storage containers with support for various authentication methods."
    tags: [azure, cloud, storage, blobs]


# pipeline_config.yaml

services: # List of services used in the pipeline
  - name: azure_storage # Name of the service, should be unique
    type: azure_blob # Type of the service, can be one of: azure_blob, database, azure_search, etc.
    test_connection: true # Whether to test the connection to the service on pipeline load
    settings: # Settings for the service connection
      account_name: ${AZURE_STORAGE_SERVICE_ACCOUNT_NAME} # Name of the Azure Blob Storage account, read from environment variable
      credential_type: ${AZURE_STORAGE_SERVICE_CREDENTIAL_TYPE} # Type of credential used for the connection, can be either azure_key_credential or default_azure_credential.
      credential_key: ${AZURE_STORAGE_SERVICE_ACCOUNT_KEY} # Account key for the Azure Blob Storage, read from environment variable

  # - name: destination_db
  #   type: database
  #   test_connection: true
  #   settings:
  #     host: localhost
  #     port: 5432
  #     user: user
  #     password: pass
  #     database: destination_db

  # - name: azure_ai_search
  #   type: azure_search
  #   test_connection: true
  #   settings:
  #     service_name: mysearchservice
  #     index_name: myindex
  #     api_key: myapikey

steps: # List of steps that can be used in the pipeline
  - id: extract_pdf # Unique identifier for the step
    description: Extract documents from source # Description of the step
    type: script # Type of the step, e.g., script, service, etc.
    module_name: extract_pdf # Name of the module to be used for this step
    module_path: ./doc/proc/step/extract_pdf.py # Path to the module file, relative to the folder where the execution is run
    class_name: PDFExtractorStep # Class name in the module to be instantiated
    tags: [pdf, extraction, azure_blob] # Tags for the step, can be used for filtering or categorization

  - id: document_transformer
    description: Transform and preprocess documents
    type: script
    module_name: document_transformer
    module_path: ./doc/proc/step/document_transformer.py
    class_name: DocumentTransformerStep
    tags: [transform, preprocessing, azure_blob]

  - id: document_loader
    description: Load processed documents to destination
    type: script
    module_name: document_loader
    module_path: ./doc/proc/step/document_loader.py
    class_name: DocumentLoaderStep
    tags: [load, azure_blob, database]

  - id: pdf_to_png
    description: Convert PDF pages to PNG images
    type: script
    module_name: pdf_to_png
    module_path: ./doc/proc/step/extract_pdf_to_png.py
    class_name: PDFPagesToPNGStep
    tags: [pdf, png, azure_blob]

pipelines: # List of pipelines that can be executed
  - name: pipeline_1 # Name of the pipeline, should be unique
    description: 'A pipeline to extract, transform, and load documents from Azure Blob Storage to a database' # Description of the pipeline
    updated_at: '2023-10-01T12:00:00Z' # Last updated timestamp in ISO 8601 format
    version: '1.0' # Version of the pipeline, can be used for versioning

    step_instances: # List of step instances in the pipeline
      # Each step instance refers to a step defined above and can have custom settings
      - name: extract # name of the step instance, should be unique within the pipeline
        step_id: extract_pdf # reference to the step id defined above
        enabled: true # whether the step is enabled or not
        settings: # settings for the step instance, can include any custom parameters
          fail_pipeline_on_error: true # whether to fail the entire pipeline if this step fails
          retry_on_failure: true # whether to retry this step on failure
          retries: 3 # number of retries if the step fails
          timeout: 600 # timeout for the step in seconds
          # additional custom settings can be added here
          key1: value1
          key2: value2

      - name: transform
        step_id: document_transformer
        enabled: true
        settings:
          fail_pipeline_on_error: true
          retry_on_failure: false
          retries: 3
          timeout: 600
          key1: value1
          key2: value2

      - name: load
        step_id: document_loader
        enabled: true
        settings:
          fail_pipeline_on_error: true
          retry_on_failure: false
          retries: 3
          timeout: 600
          key1: value1
          key2: value2

      - name: pdf_to_png
        step_id: pdf_to_png
        enabled: true
        settings:
          fail_pipeline_on_error: true
          retry_on_failure: false
          retries: 3
          timeout: 600
          png_output_folder: ./output/png # Custom setting for PNG output folder, relative to the execution path
          num_pages: 10 # Custom setting for number of pages to convert

    # Execution sequence of the steps in the pipeline
    # This defines the order in which the steps will be executed
    execution_sequence: [extract, pdf_to_png, load, transform]

    # Pipeline-wide settings
    settings:
      enabled: true # whether the pipeline is enabled or not
      retries: 2 # number of retries for the entire pipeline if it fails
      retry_delay: 60 # delay in seconds before retrying the pipeline
      timeout: 300 # timeout for the entire pipeline in seconds
      max_concurrent_runs: 5 # Maximum number of concurrent runs for the pipeline
      logging: # Logging settings for the pipeline
        enabled: true # whether logging is enabled for the pipeline
        level: INFO # Logging level, e.g., DEBUG, INFO, WARNING, ERROR
        format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s' # Format for log messages
        handlers: # Handlers for logging, can include console, file, etc.
          - type: console # Type of handler, e.g., console, file, etc.
            level: INFO # Level for this handler
          - type: file # Another handler type
            level: ERROR # Level for this handler
            filename: pipeline_errors.log # File to log errors
      
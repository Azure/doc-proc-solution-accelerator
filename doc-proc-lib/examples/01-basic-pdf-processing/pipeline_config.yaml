# Basic PDF Processing Pipeline Configuration

# Service instances
service_instances:
  - name: primary_ai_inference_service
    service_catalog_id: azure_ai_inference_service_01
    settings:
      endpoint: ${AZURE_AI_INFERENCE_SERVICE_ENDPOINT}
      credential_type: ${AZURE_AI_INFERENCE_SERVICE_CREDENTIAL_TYPE}
      api_key: ${AZURE_AI_INFERENCE_SERVICE_API_KEY}

# Pipeline definition
pipelines:
  - name: basic_pdf_processor
    description: 'Simple pipeline to extract text from PDF documents using AI services'
    version: '1.0'

    # Pipeline steps
    steps:
      # Step 1: Retrieve content from source
      - name: content_retriever
        step_catalog_id: content_retriever
        enabled: true
        fail_pipeline_on_error: true
        retry_on_failure: false
        retries: 3
        timeout: 600
        services: []
        debug_mode: false
        settings:
          temp_folder: "./tmp/pdf_processing/downloads"
          include_content_bytes_as_field: false
          use_temp_file_for_content: true

      # Step 2: Identify document type
      - name: document_type_identifier
        step_catalog_id: document_type_identifier
        enabled: true
        fail_pipeline_on_error: true
        retry_on_failure: false
        retries: 3
        timeout: 300
        services: []
        debug_mode: false
        settings:
          identification_methods: "magic_bytes, file_extension"

      # Step 3: Extract text from PDF using AI
      - name: pdf_text_extractor
        step_catalog_id: ai_pdf_text_extractor
        enabled: true
        fail_pipeline_on_error: true
        retry_on_failure: true
        retries: 2
        timeout: 1800
        services: [primary_ai_inference_service]
        debug_mode: false
        settings:
          ai_model_inference_service: "primary_ai_inference_service"
          output_field_name: "chunks"
          png_output_folder: "./tmp/pdf_processing/png"
          num_pages: -1  # Process all pages
          system_prompt: "You are an AI assistant that helps convert images of PDF pages to markdown text. Only output valid markdown."
          user_prompt: "Extract the text from the following image into markdown and provide descriptions of images. Always format the markdown as follows:\n==Extracted-Text==\n{Insert extracted text as markdown here}\n==End-Extracted-Text==\n\n==Image-Descriptions==\n{Insert image descriptions as markdown here}\n==End-Image-Descriptions=="
          max_completion_tokens: 4000
          temperature: 1.0
          top_p: 0.4
          frequency_penalty: 0.0
          presence_penalty: 0.0
  
    execution_sequence: [content_retriever, document_type_identifier, pdf_text_extractor]
# Conditional Step Execution Pipeline Configuration

# Service instances
service_instances:
  - name: primary_ai_inference_service
    service_catalog_id: azure_ai_inference_service_01
    settings:
      endpoint: ${AZURE_AI_INFERENCE_SERVICE_ENDPOINT}
      credential_type: ${AZURE_AI_INFERENCE_SERVICE_CREDENTIAL_TYPE}
      api_key: ${AZURE_AI_INFERENCE_SERVICE_API_KEY}

# Pipeline definition
pipelines:
  - name: conditional_processor
    description: 'Pipeline demonstrating conditional step execution based on document properties'
    version: '1.0'

    # Pipeline steps with various conditions
    steps:
      # Step 1: Retrieve content (always runs)
      - name: content_retriever
        step_catalog_id: content_retriever
        enabled: true
        fail_pipeline_on_error: true
        retry_on_failure: false
        retries: 3
        timeout: 600
        services: []
        debug_mode: false
        settings:
          temp_folder: "./tmp/conditional/downloads"
          include_content_bytes_as_field: false
          use_temp_file_for_content: true

      # Step 2: Identify document type (always runs)
      - name: document_type_identifier
        step_catalog_id: document_type_identifier
        enabled: true
        fail_pipeline_on_error: true
        retry_on_failure: false
        retries: 3
        timeout: 300
        services: []
        debug_mode: false
        settings:
          identification_methods: "magic_bytes, file_extension"

      # Step 3: PDF extractor (only for PDF documents)
      - name: pdf_extractor
        step_catalog_id: ai_pdf_text_extractor
        enabled: true
        fail_pipeline_on_error: false
        retry_on_failure: true
        retries: 2
        timeout: 1800
        services: [primary_ai_inference_service]
        # Condition: Only process PDF files
        condition: "document_type.primary_type == 'pdf'"
        debug_mode: false
        settings:
          ai_model_inference_service: "primary_ai_inference_service"
          output_field_name: "chunks"
          png_output_folder: "./tmp/conditional/pdf_output"
          num_pages: 5  # Limit to first 5 pages for demo
          system_prompt: "You are an AI assistant that helps convert images of pages of a pdf document to markdown text. Only output valid markdown."
          user_prompt: |
            Extract the text from the following image into markdown and provide descriptions of images. 
            Always format the markdown as follows to distinguish the text extracted from image descriptions:

            ==Extracted-Text==
              {Insert extracted text as markdown here}
              ==End-Extracted-Text==

              ==Image-Descriptions==
              {Insert image descriptions as markdown here}
              ==End-Image-Descriptions==
          max_completion_tokens: 4000
          temperature: 1.0

      # Step 4: Word extractor (only for Word documents)
      - name: word_extractor
        step_catalog_id: ai_word_text_extractor
        enabled: true
        fail_pipeline_on_error: false
        retry_on_failure: true
        retries: 2
        timeout: 1800
        services: [primary_ai_inference_service]
        # Condition: Only process Word files
        condition: "document_type.primary_type == 'word_document'"
        debug_mode: false
        settings:
          ai_model_inference_service: "primary_ai_inference_service"
          output_field_name: "chunks"
          png_output_folder: "./tmp/conditional/word_output"
          extract_images: true
          extract_tables: true
          max_chunk_size: 4000
          system_prompt: "You are an AI assistant that helps convert images extracted from a word document to markdown text. Only output valid markdown."
          user_prompt: |
            Extract the text from the following image into markdown and provide descriptions of images. If the image has no text, don't output any text, just provide the image description. 
            Always format the markdown as follows to distinguish the text extracted from image descriptions:

            ==Extracted-Text==
              {Insert extracted text as markdown here}
              ==End-Extracted-Text==

              ==Image-Descriptions==
              {Insert image descriptions as markdown here}
              ==End-Image-Descriptions==

      # Step 5: Large file handler (only for files > 1MB)
      - name: large_file_processor
        step_catalog_id: custom_ai_prompt
        enabled: true
        fail_pipeline_on_error: false
        retry_on_failure: true
        retries: 2
        timeout: 900
        services: [primary_ai_inference_service]
        # Condition: Only process files larger than 1MB (1048576 bytes)
        condition: "file_size >= 1048576"
        debug_mode: false
        settings:
          ai_model_inference_service: "primary_ai_inference_service"
          content_iterator_field: "chunks"
          chunk_fields_to_apply_prompt_on: "markdown,text"
          output_field_name: "large_file_summary"
          system_prompt: "You are an expert at summarizing large documents efficiently."
          user_prompt: "Provide a brief summary of this section from a large document:\n{chunk_content}"
          max_completion_tokens: 500
          temperature: 0.3

      # Step 6: High priority document handler
      - name: priority_processor
        step_catalog_id: custom_ai_prompt
        enabled: true
        fail_pipeline_on_error: false
        retry_on_failure: true
        retries: 2
        timeout: 900
        services: [primary_ai_inference_service]
        # Condition: Only process high-priority documents (must have metadata.priority == 'high')
        condition: "metadata.priority == 'high'"
        debug_mode: false
        settings:
          ai_model_inference_service: "primary_ai_inference_service"
          content_iterator_field: "chunks"
          chunk_fields_to_apply_prompt_on: "markdown,text"
          output_field_name: "priority_analysis"
          system_prompt: "You are analyzing high-priority documents. Focus on critical information."
          user_prompt: "Identify critical information, action items, and key decisions in this content:\n{chunk_content}"
          max_completion_tokens: 800
          temperature: 0.2

      # Step 7: Combined condition example (PDF AND large file AND high confidence)
      - name: detailed_analyzer
        step_catalog_id: custom_ai_prompt
        enabled: true
        fail_pipeline_on_error: false
        retry_on_failure: true
        retries: 2
        timeout: 900
        services: [primary_ai_inference_service]
        # Condition: PDF files that are large and have high type detection confidence
        condition: "document_type.primary_type == 'pdf' and file_size >= 1048576"
        debug_mode: false
        settings:
          ai_model_inference_service: "primary_ai_inference_service"
          content_iterator_field: "chunks"
          chunk_fields_to_apply_prompt_on: "markdown,text"
          output_field_name: "detailed_analysis"
          system_prompt: "You are performing detailed analysis on large, confirmed PDF documents."
          user_prompt: "Provide comprehensive analysis including themes, insights, and recommendations:\n{chunk_content}"
          max_completion_tokens: 1500
          temperature: 0.4

    execution_sequence: [content_retriever, document_type_identifier, pdf_extractor, word_extractor, large_file_processor, priority_processor, detailed_analyzer]
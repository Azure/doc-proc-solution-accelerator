# Example pipeline configuration with integrated sources
# This shows how to configure and use data sources within a pipeline

source_instances:
  - name: "documents_storage"
    source_catalog_id: "azure_blob_storage"
    description: "Main document storage for processing"
    settings:
      account_name: "${AZURE_STORAGE_ACCOUNT_NAME}"
      container_name: "documents"
      credential_type: "default_azure_credential"
    enabled: true
    test_connection: true

  - name: "sharepoint_docs"
    source_catalog_id: "sharepoint_online"
    description: "SharePoint document library"
    settings:
      tenant_id: "${AZURE_TENANT_ID}"
      client_id: "${AZURE_CLIENT_ID}"
      client_secret: "${AZURE_CLIENT_SECRET}"
      site_url: "https://contoso.sharepoint.com/sites/documents"
      library_name: "Documents"
    enabled: true
    test_connection: true

service_instances:
  - name: "document_intelligence"
    service_catalog_id: "azure_document_intelligence"
    description: "Azure Document Intelligence for OCR and text extraction"
    settings:
      endpoint: "${AZURE_DOC_INTELLIGENCE_ENDPOINT}"
      api_key: "${AZURE_DOC_INTELLIGENCE_KEY}"
    enabled: true
    test_connection: true

pipelines:
  - name: "document_processing_with_sources"
    description: "Process documents from various sources with AI extraction"
    version: "1.0"
    
    steps:
      - name: "source_crawler"
        step_catalog_id: "document_source_crawler"
        description: "Crawl configured sources for documents"
        enabled: true
        settings:
          file_filters: ["*.pdf", "*.docx", "*.txt"]
          recursive: true
        sources: ["documents_storage", "sharepoint_docs"]  # References to source instances

      - name: "document_downloader" 
        step_catalog_id: "document_downloader"
        description: "Download documents from sources"
        enabled: true
        sources: ["documents_storage", "sharepoint_docs"]

      - name: "text_extractor"
        step_catalog_id: "ai_document_text_extractor"
        description: "Extract text from documents using AI"
        enabled: true
        services: ["document_intelligence"]
        
      - name: "content_processor"
        step_catalog_id: "document_content_processor"
        description: "Process extracted text content"
        enabled: true

    execution_sequence:
      - "source_crawler"
      - "document_downloader"
      - "text_extractor"
      - "content_processor"

    settings:
      enabled: true
      timeout: 3600  # 1 hour timeout
      max_concurrent_runs: 10
# Entity Extraction Pipeline Configuration Example
# This example demonstrates how to configure the Entity Extractor Step

pipeline_config:
  id: "entity_extraction_pipeline"
  name: "Document Entity Extraction Pipeline"
  description: "Extract entities and relationships from documents"
  version: "1.0"
  
  # Services configuration
  services:
    - service_catalog_id: "azure_ai_inference"
      name: "ai_service"
      enabled: true
      settings:
        endpoint: "${AZURE_AI_ENDPOINT}"
        api_key: "${AZURE_AI_API_KEY}"
        model_name: "gpt-4o"

  # Pipeline steps
  steps:
    # Step 1: Identify document types
    - step_catalog_id: "document_type_identifier"
      name: "identify_document_types"
      enabled: true
      services: []
      settings:
        identification_methods: "magic_bytes, file_extension"

    # Step 2: Extract text from PDFs
    - step_catalog_id: "pdf_text_extractor"
      name: "extract_pdf_text"
      enabled: true
      services: ["ai_service"]
      settings:
        png_output_folder: "./output/png"
        num_pages: -1
        prompts:
          system: "You are an AI assistant that helps convert images of PDF pages to markdown text."
          user: "Extract the text from this PDF page image into well-structured markdown."
        max_completion_tokens: 4000
        temperature: 0.3

    # Step 3: Extract entities and relationships
    - step_catalog_id: "entity_extractor"
      name: "extract_entities"
      enabled: true
      services: ["ai_service"]
      settings:
        # Input/Output configuration
        chunk_field_to_extract_entities_from: "text"
        output_field_name: "extracted_entities"
        
        # Entity types to extract
        extract_people: true
        extract_places: true
        extract_locations: true
        extract_organizations: true
        extract_relationships: true
        
        # Custom entity types for specific domains
        custom_entity_types: 
          - "PRODUCT"
          - "TECHNOLOGY"
          - "EVENT"
          - "DATE"
          - "MONETARY_AMOUNT"
        
        # Output configuration
        output_format: "structured"  # or "json"
        include_confidence: true
        include_context: true
        
        # AI model parameters for consistent extraction
        max_completion_tokens: 6000
        temperature: 0.1  # Low temperature for consistent results
        top_p: 1.0
        frequency_penalty: 0.0
        presence_penalty: 0.0
        
        # Custom prompts (optional - will use defaults if not specified)
        prompts:
          system: |
            You are an expert entity extraction system specialized in identifying named entities and their relationships from documents.
            
            Extract the following entity types: PERSON, PLACE, LOCATION, ORGANIZATION, PRODUCT, TECHNOLOGY, EVENT, DATE, MONETARY_AMOUNT
            
            Also extract RELATIONSHIPS between entities, such as:
            - Person works for Organization
            - Person lives in Location  
            - Organization located in Place
            - Product developed by Organization
            - Event occurred at Location
            - Any other meaningful relationships
            
            Requirements:
            - Be precise and accurate in extractions
            - Only extract entities clearly mentioned in the text
            - Provide confidence scores (1-10) for each extraction
            - Include surrounding context for each entity
            - Format output as valid JSON
            
            Output Format:
            {
              "entities": [
                {
                  "text": "entity text as it appears",
                  "type": "ENTITY_TYPE", 
                  "confidence": confidence_score,
                  "context": "surrounding text context",
                  "start_position": start_char_position,
                  "end_position": end_char_position
                }
              ],
              "relationships": [
                {
                  "entity1": "first entity",
                  "entity2": "second entity",
                  "relationship": "relationship description", 
                  "confidence": confidence_score,
                  "context": "supporting text context"
                }
              ]
            }
          
          user: |
            Please extract entities and relationships from the following text:
            
            {chunk_content}
            
            Return only the JSON output with extracted entities and relationships.

    # Step 4: Analyze extracted entities for insights
    - step_catalog_id: "custom_ai_prompt"
      name: "analyze_entities"
      enabled: true
      services: ["ai_service"]
      settings:
        chunk_field_to_apply_prompt_on: "extracted_entities"
        output_field_name: "entity_analysis"
        max_completion_tokens: 3000
        temperature: 0.3
        prompts:
          system: |
            You are an expert data analyst specializing in entity relationship analysis.
            Analyze extracted entities and relationships to provide insights about:
            - Key people and their roles
            - Important organizations and their relationships
            - Geographic patterns and locations
            - Business relationships and networks
            - Potential risks or opportunities
          user: |
            Analyze these extracted entities and relationships for insights:
            
            {chunk_content}
            
            Provide a concise analysis focusing on key patterns, relationships, and insights.

# Example input documents structure
input_data:
  documents:
    - file_path: "./documents/contract.pdf"
      file_name: "contract.pdf"
    - file_path: "./documents/meeting_notes.pdf" 
      file_name: "meeting_notes.pdf"
    - file_path: "./documents/business_plan.pdf"
      file_name: "business_plan.pdf"

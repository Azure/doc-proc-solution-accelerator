version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: doc-proc-backend:${TAG:-latest}
    container_name: doc-proc-backend
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
    networks:
      - doc-proc-network
    volumes:
      - ./tmp:/app/tmp  # For temporary files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Worker service
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: doc-proc-worker:${TAG:-latest}
    container_name: doc-proc-worker
    restart: unless-stopped
    networks:
      - doc-proc-network
    volumes:
      - ./tmp:/app/tmp  # For temporary files
    healthcheck:
      test: ["CMD", "python", "-c", "print('Worker healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: doc-proc-frontend:${TAG:-latest}
    container_name: doc-proc-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - doc-proc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  doc-proc-network:
    driver: bridge
    name: doc-proc-network

volumes:
  # Removed redis_data volume as Redis is no longer used